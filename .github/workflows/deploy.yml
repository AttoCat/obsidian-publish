name: Deploy Quartz

on:
  schedule:
    - cron: "0 9 * * *" # 毎朝9時JSTは0時UTC
  workflow_dispatch: # 手動実行も可能

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm i

      - name: Install AWS CLI
        run: pip install awscli

      - name: Sync Articles from R2
        run: |
          aws s3 sync s3://${{ secrets.R2_BUCKET_NAME }}/Publish content/Publish \
            --endpoint-url ${{ secrets.R2_ENDPOINT }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Build Quartz
        run: npx quartz build --directory content/Publish

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: pages deploy public --project-name=obsidian-publish
